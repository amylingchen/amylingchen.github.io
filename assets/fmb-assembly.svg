<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="title desc">
  <title id="title">FMB robotic assembly system</title>
  <desc id="desc">A stylized UR5e robot grasps a peg and inserts it into an assembly board.</desc>
